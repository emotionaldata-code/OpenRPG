name: openrpg
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: openrpg
      POSTGRES_PASSWORD: openrpg_local
      POSTGRES_DB: openrpg
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openrpg -d openrpg"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
